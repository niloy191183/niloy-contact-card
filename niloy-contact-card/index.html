<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Contact | Iftekhar Ahmmed Niloy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #f3f4f6; color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: 100%; max-width: 390px; background: #fff; border-radius: 22px;
      padding: 32px 24px; text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.09);
    }
    .avatar {
      width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 50%;
      display: grid; place-items: center; background: #e5e7eb;
      color: #374151; font-size: 27px; font-weight: 650;
    }
    h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.25; }
    .subtitle { margin: 0 0 26px; color: #6b7280; font-size: 14px; }
    .detail {
      display: block; padding: 14px 12px; margin: 10px 0;
      border: 1px solid #e5e7eb; border-radius: 12px;
      color: #111827; text-decoration: none; overflow-wrap: anywhere;
    }
    .detail small {
      display: block; margin-bottom: 4px; color: #6b7280; font-size: 11px;
      text-transform: uppercase; letter-spacing: .08em;
    }
    .save {
      display: block; margin-top: 22px; padding: 15px;
      border-radius: 12px; background: #111827; color: white;
      text-decoration: none; font-weight: 600;
    }
    footer { margin-top: 22px; color: #9ca3af; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="avatar" aria-hidden="true">IN</div>
    <h1>Iftekhar Ahmmed Niloy</h1>
    <p class="subtitle">Contact card</p>

    <a class="detail" href="tel:01908483744">
      <small>Phone</small>01908483744
    </a>
    <a class="detail" href="mailto:niloy191183@gmail.com">
      <small>Email</small>niloy191183@gmail.com
    </a>

    <a class="save" href="contact.vcf" download>Save Contact</a>
    <footer>Tap a detail to call or email.</footer>
  </main>
</body>
</html>
